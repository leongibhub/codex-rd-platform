[agents]
max_concurrent_threads_per_session = 8

# OpenAI Developer Docs MCP for version-specific Codex/OpenAI documentation.
[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

# Local Company Context MCP.
# Run scripts/setup.ps1 first; it creates .venv, installs MCP dependencies,
# and regenerates the absolute launch paths below via scripts/write_local_config.py.
[mcp_servers.company_context]
command = "D:\\codex-rd-platform\\.venv\\Scripts\\python.exe"
args = ["D:\\codex-rd-platform\\tools\\mcp\\company-context\\server.py"]
cwd = "D:\\codex-rd-platform"
required = true
env_vars = [
  "COMPANY_LOCAL_ROOTS",
  "REDMINE_BASE_URL",
  "REDMINE_API_KEY",
  "REDMINE_PROJECT",
  "RAGFLOW_BASE_URL",
  "RAGFLOW_API_KEY",
  "RAGFLOW_DATASET_ID",
  "GITLAB_BASE_URL",
  "GITLAB_TOKEN",
  "GITLAB_PROJECT_ID",
]
startup_timeout_sec = 20
tool_timeout_sec = 60
enabled = true
