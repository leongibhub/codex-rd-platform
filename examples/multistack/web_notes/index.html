<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline Notes</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <header><h1>Offline Notes</h1><p>Your notes stay in this browser.</p></header>
      <form id="note-form">
        <label for="title">Title</label>
        <input id="title" name="title" maxlength="500" required>
        <label for="body">Note</label>
        <textarea id="body" name="body" maxlength="500" required></textarea>
        <div class="actions"><button id="submit" type="submit">Add note</button><button id="cancel-edit" type="button" hidden>Cancel edit</button></div>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <label for="search">Search notes</label>
      <input id="search" type="search" placeholder="Title or note text">
      <section id="notes" aria-live="polite"></section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
