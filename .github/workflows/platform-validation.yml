name: Platform validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-and-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/mcp/company-context/requirements.txt
      - name: Install declared Python dependencies
        run: python -m pip install --requirement tools/mcp/company-context/requirements.txt
      - name: Run runtime and platform contracts
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .rd-platform/ci
          python -m unittest discover -s tests/runtime -v 2>&1 | tee .rd-platform/ci/runtime.txt
          python -m unittest discover -s tests/platform -v 2>&1 | tee .rd-platform/ci/platform.txt
          python -m unittest discover -s tests/independent_v3 -v 2>&1 | tee .rd-platform/ci/independent-v3.txt
          python -m unittest discover -s tests/independent_multistack -p test_v3_adapter_blackbox.py -v 2>&1 | tee .rd-platform/ci/adapter-blackbox.txt
      - name: Upload validation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: runtime-platform-evidence-${{ runner.os }}-${{ github.run_id }}
          path: .rd-platform/ci/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  multistack-manifests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/mcp/company-context/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
      - name: Require Windows native GNU C++
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = Get-Command g++.exe -ErrorAction SilentlyContinue
          if (-not $compiler) { throw 'native g++ is NOT_AVAILABLE on the Windows runner' }
          Split-Path -Parent $compiler.Source | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install declared Python dependencies
        run: python -m pip install --requirement tools/mcp/company-context/requirements.txt
      - name: Run every declared manifest phase
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .rd-platform/ci
          python -m rd_platform stack-run examples/multistack/cpp_inventory/manifest.json --root "$GITHUB_WORKSPACE" 2>&1 | tee .rd-platform/ci/cpp_inventory.txt
          python -m rd_platform stack-run examples/multistack/python_expenses/manifest.json --root "$GITHUB_WORKSPACE" --phase build --phase unit 2>&1 | tee .rd-platform/ci/python_expenses.txt
          python -m rd_platform stack-run examples/multistack/web_notes/manifest.json --root "$GITHUB_WORKSPACE" --phase unit 2>&1 | tee .rd-platform/ci/web_notes.txt
          python -m rd_platform stack-run examples/multistack/java_booking/manifest.json --root "$GITHUB_WORKSPACE" 2>&1 | tee .rd-platform/ci/java_booking.txt
          python -m rd_platform stack-run examples/multistack/wechat_expenses/manifest.json --root "$GITHUB_WORKSPACE" --phase unit --phase integration 2>&1 | tee .rd-platform/ci/wechat_expenses.txt
      - name: Upload manifest evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: multistack-evidence-${{ runner.os }}-${{ github.run_id }}
          path: .rd-platform/ci/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
